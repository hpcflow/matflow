doc: |
  A workflow used to test we can correctly initialise the `LoadCase` class from
  YAML parametrisations.

tasks:
  - schema: define_load_case
    inputs:
      load_case:
        steps:
          - total_time: 100
            num_increments: 200
            target_def_grad_rate:
              - [0.001, 0.0, 0.0]
              - [0.0, x, 0.0]
              - [0.0, 0.0, x]
            stress:
              - [x, x, x]
              - [x, 0.0, x]
              - [x, x, 0.0]

  # Each deformation gradient component follows a random polynomial in time,
  # F_ij(t) = δ_ij + c_1 t + c_2 t² + c_3 t³, sampled at the end of each of
  # `num_steps` equal time intervals to give one load step per interval:
  - schema: define_load_case
    inputs:
      load_case::random_polynomial:
        total_time: 100
        num_steps: 10
        coefficient_ranges:
          - [-1.0e-3, 1.0e-3] # c_1
          - [-1.0e-5, 1.0e-5] # c_2
          - [-1.0e-7, 1.0e-7] # c_3
        num_increments: 20
        seed: 12345

  # A monotonic exponential deformation-gradient path, normalised to conserve
  # volume, with multiple increments per load step and a fixed seed:
  - schema: define_load_case
    inputs:
      load_case::random_exponential:
        total_time: 100
        num_steps: 100
        num_increments: 4
        conserve_volume: true
        seed: 12345
        max_tries: 200
        k_range: [0.01, 0.08]
        delta_f_range: [-0.05, 0.05]

doc:
  - >
    Generate crystal plasticity training data (volume-averaged Cauchy stress and 
    deformation gradient per time increment) for training a reduced order model.

# inputs:
#   num_load_cases: 5000
#   num_microstructures_per_load_case: 5

tasks:
  - schema: sample_texture_from_ODF_mat_file_mtex
    repeats: 25_000
    inputs:
      ODF_mat_file_path: <<demo_data_file:ODF.mat>>
      num_orientations: 1000

  - schema: generate_volume_element_from_statistics
    inputs:
      grid_size: [64, 64, 64]
      size: [1, 1, 1]
      phase_statistics:
        - type: primary
          name: Al
          crystal_structure: cubic
          volume_fraction: 1.00 # `volume_fraction` for all phases must sum to 1!
          size_distribution:
            ESD_mean: 0.3 # Specify either `ESD_mean` or `ESD_log_mean`
            ESD_log_stddev: 0.1
            num_bins: 10 # Specify either `num_bins` or `bin_step_size

  - schema: generate_load_case
    method: uniaxial

  - schema: define_load_case
    repeats:
      number: 5000
      master_seed: 12345
    inputs:
      load_case::random_polynomial:
        seed: <<resource:random_seed>>
        total_time: 100
        num_steps: 10
        coefficient_ranges:
          - [-1.0e-3, 1.0e-3] # c_1
          - [-1.0e-5, 1.0e-5] # c_2
          - [-1.0e-7, 1.0e-7] # c_3
        num_increments: 1

  - schema: simulate_VE_loading_damask
    repeats:
      number: 5
      nesting_order: 2
    nesting_order:
      inputs.load_case: 1
      inputs.volume_element: 2.5
    multi_path_sequences:
      - paths:
          - inputs.damask_phases.Al.mechanical.plastic.a_sl
          - inputs.damask_phases.Al.mechanical.plastic.xi_0_sl.0
          - inputs.damask_phases.Al.mechanical.plastic.xi_inf_sl.0
          - inputs.damask_phases.Al.mechanical.plastic.h_0_sl-sl
        nesting_order: 2.5
        values::from_load_txt:
          file_path: C:/downloads/posterior.txt
          num_samples: 25_000
    inputs:
      homogenization:
        SX:
          mechanical: { type: "pass" }
          N_constituents: 1
      damask_phases:
        Al:
          lattice: cF
          mechanical:
            output: [F, P, F_e, F_p, L_p, O]
            elastic:
              type: Hooke
              C_11: 106750000000
              C_12: 60410000000
              C_44: 28340000000
            plastic:
              type: phenopowerlaw
              N_sl: [12]
              a_sl: 2.25
              atol_xi: 1
              dot_gamma_0_sl: 0.001
              h_0_sl-sl: 75.0e+6
              h_sl-sl: [1, 1, 1.4, 1.4, 1.4, 1.4, 1.4]
              n_sl: 20
              output: [xi_sl]
              xi_0_sl: [31.0e+6]
              xi_inf_sl: [63.0e+6]
      damask_post_processing:
        - name: add_stress_Cauchy
          args: { P: P, F: F }
      VE_response_data:
        phase_data:
          - field_name: sigma
            phase_name: Al
            out_name: vol_avg_stress
            transforms: [{ mean_along_axes: 1 }]
          - field_name: F
            phase_name: Al
            out_name: vol_avg_def_grad
            transforms: [{ mean_along_axes: 1 }]

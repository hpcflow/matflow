tasks:
  - schema: sample_direct_MC    
    inputs:
      dimension: 120
    repeats:
      number: 100 # num_samples
      generate_seed_sequence: false    
    groups:
      - name: all

  - schema: system_analysis_32

  - schema: collate_results
    resources:
      any:        
        num_cores: 1
        scheduler_args:
          directives:
            --time: 00:30:00
            --partition: ukaea-spr
            --account: UKAEA-AP002-CPU  
    inputs:
      p_0: 0.1

  - schema: initialise_markov_chains
    sequences:
      - path: inputs.chain_index
        values::from_range:
          start: 0
          stop: 10 # num_chains: num_samples * p_0
          step: 1

  - schema: system_analysis_16
    output_labels:
      evaluate_yield_stress_limit_state:      
        - parameter: g
          label: coarse_initial

  - schema: generate_next_state
    inputs:
      proposal:
        type: norm
        scale: 1.0
    groups:
      - name: all

  - schema: system_analysis_16
    resources:
      simulate_VE_loading_damask:
        any:
          skip_downstream_on_failure: false
      evaluate_yield_stress_limit_state:
        any:
          skip_downstream_on_failure: false        
    output_labels:
      evaluate_yield_stress_limit_state:
        - parameter: g
          label: coarse

  - schema: increment_sub_chain
    inputs:
      temperature: 1e+6 # Pa; should be of similar scale to threshold
   
  - schema: check_sub_chain
    inputs:
      num_inner_states: 3

  - schema: system_analysis_32
    resources:
      generate_volume_element_from_voronoi_random_variates:
        any:
          skip_downstream_on_failure: false # TODO: add skip_downstream_on_false_condition with default False            
      simulate_VE_loading_damask: 
        any:
          skip_downstream_on_failure: false # TODO: add skip_downstream_on_false_condition with default False      
      evaluate_yield_stress_limit_state:    
        any:
          skip_downstream_on_failure: false # TODO: add skip_downstream_on_false_condition with default False
    condition:
      generate_volume_element_from_voronoi_random_variates: task.check_sub_chain.outputs.endpoint_moved
      simulate_VE_loading_damask: task.check_sub_chain.outputs.endpoint_moved
      evaluate_yield_stress_limit_state: task.check_sub_chain.outputs.endpoint_moved
    output_labels:
      evaluate_yield_stress_limit_state:
        - parameter: g
          label: fine

  - schema: increment_chain_RST
    input_sources:
      # TODO: support meta-task names in input sources (will need to resolve which task 
      # provides the parameter...)
      g[coarse_initial]: [task.evaluate_yield_stress_limit_state_2.output]
    groups:
      - name: all
